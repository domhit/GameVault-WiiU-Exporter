name: Build Wii U Exporter

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -f Dockerfile.github -t gamevault-wiiu-build .
      - name: Build WUHB
        run: docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project gamevault-wiiu-build make -j2
      - name: Upload WUHB artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-WiiU-Exporter-v0.1.0
          path: build/release/*.wuhb
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/release/GameVault-WiiU-Exporter.wuhb --title "GameVault Wii U Exporter ${GITHUB_REF_NAME}" --generate-notes
